# SSoT Compliance Check
# This workflow calls the central, reusable SSoT linter.
# DO NOT add logic here. To update the linter, modify the reusable workflow in gcd-shared-actions.
name: SSoT Compliance Check

on:
  pull_request:
    branches: [ main, develop ]

jobs:
 validate-ssot:
    name: "Run Official SSoT Linter"
    # This calls the master workflow from the correct SSoT location.
    # @v1 is the producer's deliberately MOVING major alias (gcs-project-management#602 ruling 2):
    # each v1.x.y release reaches this repo with no edit here. Both version pins are omitted on
    # purpose: they default to the producer's measured canonical (governance, tooling) pair.
    uses: GenCr-ft/gcd-shared-actions/.github/workflows/reusable-ssot-linter.yml@v1
    secrets:
      CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
    with:
      # Hard gate: repo is clean (0 broken links) — refs gcs-devops-standards#123.
      continue-on-error: false